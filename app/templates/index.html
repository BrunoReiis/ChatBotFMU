<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>ChatBot - NexusBank</title>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="titleChatbot">💳 ChatBot - NexusBank</h1>
        </header>
        <main>
            <div class="chatbox" id="chat-messages"></div>
            <form id="chat-form" class="input-area">
                <input type="text" id="chat-input" placeholder="Digite sua pergunta..." autocomplete="off" required>
                <button type="submit">Enviar</button>
            </form>
        </main>
        <footer>
            <p>&copy; 2026 ChatBot - Todos os direitos reservados.</p>
        </footer>
    </div>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
